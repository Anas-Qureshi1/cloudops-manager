name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-scan:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pip-audit

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml -p no:platformdirs

      - name: Run pip-audit Dependency Scan
        run: |
          python -m pip_audit -r requirements.txt

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t cloudops-manager:ci .
