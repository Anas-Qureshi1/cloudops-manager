sonar.projectKey=cloudops-manager
sonar.projectName=CloudOps Manager
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Analysis exclusions for generated and non-source files
sonar.exclusions=**/*.db,**/*.sqlite*,**/__pycache__/**,venv/**,.venv/**,*.xml,*.json

# Test file inclusions
sonar.test.inclusions=tests/**/test_*.py

# Test execution and code coverage report paths
sonar.python.xunit.reportPath=test-results.xml
sonar.python.coverage.reportPaths=coverage.xml
